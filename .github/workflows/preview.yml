name: Generate CV Preview

on:
  push:
    paths:
      - cv.md
      - style.css
      - build.py
      - template.html

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Inter font and set as default sans-serif
        run: |
          mkdir -p ~/.fonts ~/.config/fontconfig
          curl -L "https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip" -o inter.zip
          unzip inter.zip "*.ttf" -d ~/.fonts
          cat > ~/.config/fontconfig/fonts.conf <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias>
              <family>sans-serif</family>
              <prefer><family>Inter</family></prefer>
            </alias>
          </fontconfig>
          XML
          fc-cache -fv

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Build CV
        run: python build.py

      - name: Screenshot CV
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import os
          os.makedirs('docs', exist_ok=True)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 794, 'height': 1123})
              page.goto('file://${{ github.workspace }}/output/cv.html', wait_until='load')
              page.wait_for_timeout(500)
              page.screenshot(path='docs/preview.png', type='png', full_page=False)
              browser.close()
          "

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/preview.png output/cv.html
          git diff --staged --quiet || git commit -m "chore: update CV output and preview [skip ci]"
          git push
